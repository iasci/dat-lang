[package]
name = "dat-rt"
description = "The dat runtime: every primitive operation, error and printer, shared by the interpreter and generated Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
backtrace = "0.3.77"
# Sets and maps are built on `HashTable`. Both are pinned exactly and
# reviewed at each upgrade.
hashbrown = { version = "=0.17.1", default-features = false }
foldhash = { version = "=0.2.0", default-features = false }
