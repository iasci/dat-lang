# Every push and pull request: build, unit tests, lints, and the conformance
# runner in both run modes on Linux and macOS. A separate job on Linux runs
# the latency budgets and speed gates (M0 exit criteria 9 and 13-16).
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/dat-cache
      - name: Build
        run: cargo build --release --locked
      - name: Unit tests
        run: cargo test --release --locked
      - name: Lints
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets --locked -- -D warnings
      - name: Conformance (examples, fault-injection self-test, spec blocks, structure) in both modes
        run: target/release/dat-conformance all --verbose
      - name: Keep the generated Rust and the spec cases when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.os }}
          path: |
            target/dat-cache/crates/*/src/main.rs
            target/conformance-tmp

  perf:
    name: latency budgets and speed gates
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/dat-cache
      - run: cargo build --release --locked
      - name: Measure
        run: |
          set -o pipefail
          target/release/dat-conformance perf | tee perf.txt
      - name: Job summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat perf.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
